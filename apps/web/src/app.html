<!doctype html>
<html lang="%lang%" dir="%dir%">
  <head>
    <meta charSet='utf-8' />
    <meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=overlays-content,maximum-scale=1.0,user-scalable=no' />
    <meta name='format-detection' content='telephone=no,date=no,address=no,email=no,url=no' />
    <title>%app_name%</title>
    <meta name='description' content='%app_description%' />
    <meta property='og:type' content='website' />
    <meta property='og:site_name' content='%app_name%' />
    <meta property='og:title' content='%app_name%' />
    <meta property='og:description' content='%app_description%' />
    <meta property='og:url' content='%og_url%' />
    <meta property='og:image' content='%og_image%' />
    <meta property='og:image:width' content='256' />
    <meta property='og:image:height' content='256' />
    <meta property='og:image:alt' content='%app_name%' />
    <meta property='og:locale' content='%og_locale%' />
    <meta name='twitter:card' content='summary' />
    <meta name='twitter:title' content='%app_name%' />
    <meta name='twitter:description' content='%app_description%' />
    <meta name='twitter:image' content='%og_image%' />
    <meta name='twitter:image:alt' content='%app_name%' />
    <link rel='icon' href='/images/favicon.ico' sizes='any' />
    <link rel='apple-touch-icon' sizes='180x180' href='/images/icon-apple-touch-icon.png' />
    <link rel='manifest' href='%manifest%' />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
