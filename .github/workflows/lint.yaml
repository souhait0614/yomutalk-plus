name: Lint

on:
  push:
    branches:
      - main

  pull_request_target:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-checkout:
    name: Pre checkout
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pre-checkout.yaml

  lint:
    name: Lint
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs:
      - pre-checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ needs.pre-checkout.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Setup tools
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Type Check
        run: |
          pnpm run typecheck
        env:
          PUBLIC_VOICEVOX_ENGINE_API_ENABLED: ${{ vars.PUBLIC_VOICEVOX_ENGINE_API_ENABLED }}

      - name: Lint
        run: |
          pnpm run lint
        env:
          PUBLIC_VOICEVOX_ENGINE_API_ENABLED: ${{ vars.PUBLIC_VOICEVOX_ENGINE_API_ENABLED }}
