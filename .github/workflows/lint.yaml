name: Lint

on:
  push:
    branches:
      - main

  pull_request_target:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-checkout:
    name: Pre checkout
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pre-checkout.yaml

  checks:
    name: Run ${{ matrix.name }}
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    needs:
      - pre-checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            script: test
          - name: Type Check
            script: typecheck
          - name: Lint
            script: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.script }}-${{ needs.pre-checkout.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.script }}-
            ${{ runner.os }}-turbo-

      - name: Setup tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: |
          pnpm run ${{ matrix.script }}
        env:
          PUBLIC_BASE_URL: https://example.com
          PUBLIC_VOICEVOX_ENGINE_API_ENABLED: ${{ vars.PUBLIC_VOICEVOX_ENGINE_API_ENABLED }}

  lint:
    name: Lint
    if: always() && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 1
    needs:
      - checks
    steps:
      - name: Check results
        env:
          result: ${{ needs.checks.result }}
        run: |
          if [[ "$result" != "success" ]]; then
            echo "::error::Test, Type Check or Lint did not succeed (${result})"
            exit 1
          fi
