name: Pre checkout

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        description: Ref to check out (defaults to the triggering ref)
    outputs:
      ref:
        value: ${{ jobs.checkout.outputs.ref }}
        description: Ref that was checked out
      sha:
        value: ${{ jobs.checkout.outputs.sha }}
        description: Commit SHA

permissions:
  contents: read

jobs:
  checkout:
    name: Checkout
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.prepare.outputs.ref }}
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Prepare
        id: prepare
        env:
          event_name: ${{ github.event_name }}
          pr_number: ${{ github.event.pull_request.number }}
          default_ref: ${{ github.ref }}
          input_ref: ${{ inputs.ref }}
        run: |
          specify_ref="$input_ref"
          if [[ -z "$specify_ref" && "$event_name" == 'pull_request_target' ]]; then
            if [[ -z "$pr_number" ]]; then
              exit 1
            fi
            specify_ref="refs/pull/${pr_number}/merge"
          fi
          echo "ref=${specify_ref:-$default_ref}" >> $GITHUB_OUTPUT

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.prepare.outputs.ref }}
          fetch-depth: 1